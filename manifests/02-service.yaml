apiVersion: v1
kind: Service
metadata:
  name: fleet-telemetry-service
  namespace: fleet-system
  labels:
    app.kubernetes.io/name: fleet-telemetry
    app.kubernetes.io/part-of: fleet-system
spec:
  type: ClusterIP
  selector:
    # Traffic is routed ONLY to pods with this exact label
    app.kubernetes.io/name: fleet-telemetry
  ports:
    - name: http
      port: 80         # Port exposed by the Service internally
      targetPort: 8000 # Port the application container listens on inside the Pod
      protocol: TCP
