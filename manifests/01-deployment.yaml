apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-telemetry-deployment
  namespace: fleet-system
  labels:
    app.kubernetes.io/name: fleet-telemetry
    app.kubernetes.io/part-of: fleet-system
    app.kubernetes.io/version: "1.1.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-telemetry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-telemetry
    spec:
      serviceAccountName: fleet-telemetry-sa
      # Spread replicas across distinct physical Worker Nodes for High Availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - fleet-telemetry
                topologyKey: kubernetes.io/hostname
      # Pod-Level Security Context
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              until pg_isready -h db -p 5432; do
                echo "Waiting for PostgreSQL (db:5432) to accept connections..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: telemetry-api
          image: ghcr.io/mdadilhussain07/enterprise-ci-cd-fleet/fleet-telemetry:latest
          imagePullPolicy: Always
          # Container-Level Security Hardening
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
              name: http-api
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: fleet-db-config
                  key: POSTGRES_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: fleet-db-config
                  key: POSTGRES_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: fleet-db-config
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: fleet-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-db-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/v1/info
              port: http-api
            failureThreshold: 6
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/info
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: tmp-volume
          emptyDir: {}
