# Default values for fleet-telemetry (Staging / Local Environment)
replicaCount: 2

image:
  repository: ghcr.io/mdadilhussain07/enterprise-ci-cd-fleet/fleet-telemetry
  pullPolicy: Always
  tag: "latest"

serviceAccount:
  name: fleet-telemetry-sa

securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

service:
  name: fleet-telemetry-service
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: fleet.local
  tlsSecretName: fleet-tls-secret

resources:
  requests:
    cpu: "100m"
    memory: "64Mi"
  limits:
    cpu: "300m"
    memory: "128Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 50
  scaleDownStabilizationSeconds: 60

pdb:
  enabled: true
  minAvailable: 1

namespaceQuota:
  enabled: true
  requestsCpu: "1000m"
  requestsMemory: "1Gi"
  limitsCpu: "2000m"
  limitsMemory: "2Gi"
  maxPods: "10"

database:
  configMapName: fleet-db-config
  secretName: fleet-db-secret
  host: db
  port: 5432
